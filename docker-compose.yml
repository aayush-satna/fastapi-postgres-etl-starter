services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_pass
      POSTGRES_DB: etl_warehouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d etl_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://etl_user:etl_pass@db:5432/etl_warehouse
    depends_on:
      db:
        condition: service_healthy
